services:
  postgres:
    image: postgres:16-alpine
    container_name: vivfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivfy
      POSTGRES_PASSWORD: vivfy
      POSTGRES_DB: vivfy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivfy -d vivfy"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vivfy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
